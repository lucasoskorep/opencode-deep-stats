[tools]
bun = "latest"

[tasks.install]
description = "Install plugin dependencies"
run = "bun install"

[tasks.build]
description = "Build precompiled Solid TUI bundle (dist/tui.js)"
run = "bun scripts/build.ts"

[tasks.typecheck]
description = "Run TypeScript type checking"
run = "bun run typecheck"

[tasks.test]
description = "Run unit and OpenTUI rendering tests"
run = "bun run test"

[tasks.check]
description = "Build TUI bundle, typecheck, and run tests"
depends = ["build", "typecheck", "test"]
